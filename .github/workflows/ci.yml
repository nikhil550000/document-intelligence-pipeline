name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      # --locked fails if uv.lock is out of date, instead of silently updating it.
      - run: uv sync --locked

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  # Tests that need the real dataset or the services run here, and nowhere skip.
  checks-with-data-and-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      # The key holds the archive's MD5, so a new dataset version gets a new cache.
      - uses: actions/cache@v4
        with:
          path: data/CUAD_v1.zip
          key: cuad-c38f490a984420b8a62600db401fafd5

      # Checks the MD5 again, so a damaged cache is caught, not trusted.
      - run: uv run docintel data download

      # The same Postgres and object store as on a developer's machine. The
      # tests run their own workers, so the worker service is not started.
      - run: cp .env.example .env
      - run: docker compose up --detach --wait postgres objectstore

      # A skipped test would pass without checking anything, so any skip fails.
      - run: |
          uv run pytest -rs | tee pytest.log
          ! grep -q SKIPPED pytest.log
        shell: bash

      # Last, because it replaces the service containers.
      - run: uv run pytest -m restart
