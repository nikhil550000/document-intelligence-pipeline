services:
  postgres:
    image: postgres:19.0-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 5433 on the host, so a Postgres already installed on the machine can keep 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  objectstore:
    image: chrislusf/seaweedfs:4.54
    # The image runs `weed mini`: one process serving S3 on 8333, which creates
    # the bucket and the access key below on first start.
    environment:
      AWS_ACCESS_KEY_ID: ${DOCINTEL_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${DOCINTEL_S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${DOCINTEL_S3_BUCKET}
    ports:
      - "8333:8333"
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Phoenix keeps its traces in a database and a role of its own, made here once,
  # so the tracing tool has no access to the pipeline's tables.
  phoenix-database:
    image: postgres:19.0-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PHOENIX_DATABASE_PASSWORD: ${PHOENIX_DATABASE_PASSWORD:?set it in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        psql -v ON_ERROR_STOP=1 -v password="$$PHOENIX_DATABASE_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE phoenix LOGIN PASSWORD %L', :'password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'phoenix')\gexec
        SELECT 'CREATE DATABASE phoenix OWNER phoenix'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'phoenix')\gexec
        SQL

  phoenix:
    image: arizephoenix/phoenix:version-22.1.0-nonroot
    environment:
      PHOENIX_POSTGRES_HOST: postgres
      PHOENIX_POSTGRES_PORT: 5432
      PHOENIX_POSTGRES_USER: phoenix
      PHOENIX_POSTGRES_PASSWORD: ${PHOENIX_DATABASE_PASSWORD:?set it in .env}
      PHOENIX_POSTGRES_DB: phoenix
      # Traces can hold contract text, so seeing them needs a sign-in, and
      # sending them a key.
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET:?set it in .env}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD:?set it in .env}
      # No usage data about the traces leaves the machine.
      PHOENIX_TELEMETRY_ENABLED: "false"
    # The interface and the address that takes traces over HTTP.
    ports:
      - "6006:6006"
    depends_on:
      phoenix-database:
        condition: service_completed_successfully

  worker:
    build: .
    env_file: .env
    environment:
      # Inside Compose the services are reached by their names and own ports.
      DOCINTEL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DOCINTEL_S3_ENDPOINT_URL: http://objectstore:8333
      DOCINTEL_PHOENIX_URL: http://phoenix:6006
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    # Each worker works on one contract at a time, so this is how many are sent
    # to the provider at once, which keeps its rate limit in hand.
    deploy:
      replicas: 2
    # `docker compose stop` lets a worker finish the contract it holds: up to
    # 22 minutes with the committed configuration, if every model attempt times out.
    stop_grace_period: 23m
    restart: on-failure

volumes:
  postgres-data:
  objectstore-data:
