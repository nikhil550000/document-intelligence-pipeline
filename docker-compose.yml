services:
  postgres:
    image: postgres:19.0-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 5433 on the host, so a Postgres already installed on the machine can keep 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  objectstore:
    image: chrislusf/seaweedfs:4.54
    # The image runs `weed mini`: one process serving S3 on 8333, which creates
    # the bucket and the access key below on first start.
    environment:
      AWS_ACCESS_KEY_ID: ${DOCINTEL_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${DOCINTEL_S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${DOCINTEL_S3_BUCKET}
    ports:
      - "8333:8333"
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    build: .
    env_file: .env
    environment:
      # Inside Compose the services are reached by their names and own ports.
      DOCINTEL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DOCINTEL_S3_ENDPOINT_URL: http://objectstore:8333
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    # Each worker works on one contract at a time, so this is how many are sent
    # to the provider at once, which keeps its rate limit in hand.
    deploy:
      replicas: 2
    # `docker compose stop` lets a worker finish the contract it holds: up to
    # 22 minutes with the committed configuration, if every model attempt times out.
    stop_grace_period: 23m
    restart: on-failure

volumes:
  postgres-data:
  objectstore-data:
