[project]
name = "docintel"
version = "0.1.0"
description = "Extracts validated, structured records from English commercial contracts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.44.9",
    "duckdb>=2.0.1",
    "openai>=3.57.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "typer>=0.29.1",
]

[project.scripts]
docintel = "docintel.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
# The Python that uv downloads is blocked on some machines, so use an installed one.
python-preference = "only-system"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.9",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src"]
# Lets mypy know that settings are read from the environment, not passed in.
plugins = ["pydantic.mypy"]

# pypdfium2 ships without type information.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not restart'"
markers = [
    "restart: replaces the service containers; run on its own with pytest -m restart",
]
